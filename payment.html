<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Verification | SkyLuxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .payment-wrapper {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        .invoice-box {
            background: #f8f9fa;
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .zangi-call-to-action {
            background: #ff5722;
            color: white;
            padding: 18px;
            border-radius: 10px;
            text-decoration: none;
            display: block;
            font-weight: 700;
            margin-top: 20px;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .zangi-call-to-action:hover {
            background: #e64a19;
            transform: scale(1.02);
        }
        .instruction {
            font-size: 13px;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="payment-wrapper">
        <i class="fas fa-plane-arrival" style="font-size: 40px; color: var(--emirates-red);"></i>
        <h2 style="margin-top: 10px;">Finalize Booking</h2>
        <p style="font-size: 14px; color: #777;">Review your cart and request payment info via Zangi.</p>

        <div class="invoice-box" id="invoice-content">
            </div>

        <div style="font-size: 20px; font-weight: 700; margin-bottom: 20px;">
            Total: <span id="total-price" style="color: var(--emirates-red);">$0</span>
        </div>

        <button class="zangi-call-to-action" onclick="initiateZangiTransfer()">
            CHAT AGENT FOR PAYMENT <i class="fab fa-telegram-plane"></i>
        </button>

        <p class="instruction">
            <i class="fas fa-info-circle"></i> Your order details will be copied automatically. Just paste them to the agent.
        </p>
    </div>

    <script>
        function renderInvoice() {
            const cart = JSON.parse(localStorage.getItem('airlineCart')) || [];
            const container = document.getElementById('invoice-content');
            const totalEl = document.getElementById('total-price');
            let total = 0;
            let summaryText = "";

            if (cart.length === 0) {
                container.innerHTML = "<p>Your cart is empty.</p>";
                return;
            }

            cart.forEach((item, index) => {
                total += item.price;
                summaryText += `${index + 1}. ${item.flight} ($${item.price})\n`;
                container.innerHTML += `
                    <div class="item-row">
                        <span>${item.flight}</span>
                        <strong>$${item.price}</strong>
                    </div>`;
            });

            totalEl.innerText = `$${total.toLocaleString()}`;
            
            // Store the message data for the chat
            const user = localStorage.getItem('userName') || "Customer";
            const finalMsg = `SKYLUXURY ORDER\n------------------\nPassenger: ${user}\nFlights:\n${summaryText}\nGRAND TOTAL: $${total.toLocaleString()}\n------------------\nRequesting payment instructions.`;
            localStorage.setItem('pendingOrderMessage', finalMsg);
        }

        function initiateZangiTransfer() {
            const zangiID = "6811751202";
            const message = localStorage.getItem('pendingOrderMessage');
            
            // Copy details so they can be pasted in the DM
            navigator.clipboard.writeText(message).then(() => {
                alert("Booking details copied! Now paste them in the Zangi chat to receive payment info.");
                // Redirect to the direct DM of the ID provided
                window.location.href = `https://zangi.com/dl/chat?number=${zangiID}`;
            });
        }

        renderInvoice();
    </script>
</body>
</html>
