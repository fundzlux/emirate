<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SkyLuxury Airways</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gold: #d4af37;
            --emirates-red: #d71921;
            --dark-blue: #003580;
            --white: #ffffff;
            --text-dark: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
            border-bottom: 5px solid var(--primary-gold);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--emirates-red);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            display: block;
            margin-bottom: 15px;
        }

        h2 {
            color: var(--text-dark);
            margin-bottom: 5px;
            font-size: 22px;
        }

        p.welcome-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        .input-wrapper input:focus {
            border-color: var(--emirates-red);
            box-shadow: 0 0 8px rgba(215, 25, 33, 0.1);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .options a {
            color: var(--dark-blue);
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--dark-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .login-btn:hover {
            background: #00265c;
            transform: translateY(-2px);
        }

        #status-msg {
            margin-top: 15px;
            font-size: 13px;
            display: none;
        }

        .signup-link {
            margin-top: 25px;
            font-size: 14px;
            color: #777;
        }

        .signup-link a {
            color: var(--emirates-red);
            text-decoration: none;
            font-weight: 700;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <a href="index.html" class="logo"><i class="fas fa-plane-departure"></i> SkyLuxury</a>
        <h2>Welcome Back</h2>
        <p class="welcome-text">Log in to your premium account.</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPass" placeholder="••••••••" required>
                </div>
            </div>

            <div class="options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                Log In <i class="fas fa-sign-in-alt"></i>
            </button>

            <div id="status-msg"></div>
        </form>

        <div class="signup-link">
            New to SkyLuxury? <a href="signup.html">Join now</a>
        </div>

        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Return to Home</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop form from refreshing the page

            const email = document.getElementById('loginEmail').value;
            const statusMsg = document.getElementById('status-msg');
            const btn = document.querySelector('.login-btn');

            // 1. Simulate a successful verification
            statusMsg.style.display = 'block';
            statusMsg.style.color = '#28a745';
            statusMsg.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Authenticating...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            // 2. Redirect to dashboard.html after a short delay
            setTimeout(() => {
                // If you want to simulate passing a name to the dashboard:
                if(!localStorage.getItem('userName')) {
                    localStorage.setItem('userName', email.split('@')[0]); 
                }
                window.location.href = 'dashboard.html';
            }, 1200);
        });
    </script>
</body>
</html>
