<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Lux Airways | Private Dashboard</title>
    <style>
        :root {
            --sky-lux-bg: #0b1121;
            --sky-lux-gradient: linear-gradient(135deg, #0b1121 0%, #1a253c 100%);
            --accent-gold: #c5a059;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-gold: #e2c28d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'optima', 'Segoe UI', serif;
            background: var(--sky-lux-gradient);
            color: #f0f0f0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 260px;
            background: rgba(11, 17, 33, 0.95);
            border-right: 1px solid var(--glass-border);
            height: 100vh;
            position: fixed;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 1.8rem;
            color: var(--accent-gold);
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 3rem;
            font-weight: bold;
        }

        .nav-menu { list-style: none; }
        .nav-item {
            margin-bottom: 1rem;
        }

        .nav-link {
            color: #fff;
            text-decoration: none;
            display: block;
            padding: 1rem;
            border-radius: 8px;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .nav-link:hover, .nav-link.active {
            background: var(--glass);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 2rem 4rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .stats-bar {
            background: var(--glass);
            padding: 1rem 2rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            display: flex;
            gap: 2rem;
        }

        .total-counter { color: var(--accent-gold); font-weight: bold; }

        /* Grid System */
        .ticket-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2.5rem;
        }

        .ticket-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .ticket-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .city-view {
            width: 100%;
            height: 200px;
            object-fit: cover;
            filter: brightness(0.8);
        }

        .card-details {
            padding: 1.5rem;
        }

        .location { font-size: 1.2rem; margin-bottom: 0.5rem; letter-spacing: 1px; }
        .price { color: var(--accent-gold); font-size: 1.4rem; font-weight: bold; margin-bottom: 1rem; }

        .btn-add {
            width: 100%;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 0.8rem;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-add:hover {
            background: var(--accent-gold);
            color: var(--sky-lux-bg);
        }

        /* Cart Floating Counter */
        #cart-badge {
            background: var(--accent-gold);
            color: #000;
            padding: 2px 8px;
            border-radius: 50%;
            font-size: 0.8rem;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">SKY LUX</div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="#" class="nav-link active">Dashboard</a></li>
            <li class="nav-item"><a href="bookings.html" class="nav-link">Bookings</a></li>
            <li class="nav-item"><a href="cart.html" class="nav-link">My Cart <span id="cart-badge">0</span></a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header>
            <div>
                <h1>Global Flight Desk</h1>
                <p style="opacity: 0.6;">Select your next first-class destination</p>
            </div>
            <div class="stats-bar">
                <span>Items: <b id="item-count">0</b></span>
                <span>Total: <b class="total-counter" id="total-price">$0</b></span>
            </div>
        </header>

        <div class="ticket-grid" id="mainGrid">
            </div>
    </main>

    <script>
        const destinations = [
            { country: "USA", states: ["New York", "California", "Florida", "Texas", "Nevada"] },
            { country: "France", states: ["Paris", "Nice", "Lyon", "Marseille"] },
            { country: "Japan", states: ["Tokyo", "Osaka", "Kyoto", "Hokkaido"] },
            { country: "UK", states: ["London", "Manchester", "Edinburgh"] },
            { country: "UAE", states: ["Dubai", "Abu Dhabi"] },
            { country: "Italy", states: ["Rome", "Venice", "Milan", "Florence"] }
        ];

        const grid = document.getElementById('mainGrid');
        let cart = JSON.parse(localStorage.getItem('skyLuxCart')) || [];

        function updateDisplay() {
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('item-count').innerText = cart.length;
            document.getElementById('cart-badge').innerText = cart.length;
            document.getElementById('total-price').innerText = '$' + total.toLocaleString();
        }

        // Generate 100 Luxury Tickets
        for (let i = 1; i <= 100; i++) {
            const countryObj = destinations[i % destinations.length];
            const state = countryObj.states[i % countryObj.states.length];
            const price = Math.floor(Math.random() * (15000 - 3000 + 1)) + 3000;
            
            const card = document.createElement('div');
            card.className = 'ticket-card';
            card.innerHTML = `
                <img src="https://picsum.photos/seed/${i + 500}/400/300" class="city-view" alt="City View">
                <div class="card-details">
                    <div class="location">${state}, ${countryObj.country}</div>
                    <div class="price">$${price.toLocaleString()}</div>
                    <button class="btn-add" onclick="addToCart('${state}', ${price})">ADD TO CART</button>
                </div>
            `;
            grid.appendChild(card);
        }

        function addToCart(name, price) {
            const ticket = {
                id: Date.now() + Math.random(),
                destination: name,
                price: price,
                date: new Date().toLocaleDateString()
            };
            cart.push(ticket);
            localStorage.setItem('skyLuxCart', JSON.stringify(cart));
            updateDisplay();
            
            // Subtle feedback
            console.log(`Added ${name} for $${price}`);
        }

        // Initialize display on load
        updateDisplay();
    </script>
</body>
</html>
