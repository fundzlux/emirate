<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Lux Airways | Elite Travel</title>
    <style>
        :root {
            --sky-lux-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --accent-gold: #c5a059;
            --glass: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Optima', sans-serif;
            background: var(--sky-lux-bg);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 250px;
            background: rgba(15, 23, 42, 0.95);
            border-right: 1px solid rgba(197, 160, 89, 0.3);
            display: flex;
            flex-direction: column;
            padding: 2rem 1rem;
            position: fixed;
            height: 100vh;
        }

        .sidebar h2 {
            color: var(--accent-gold);
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 3rem;
            letter-spacing: 3px;
        }

        .sidebar a {
            color: var(--text-main);
            text-decoration: none;
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 8px;
            transition: 0.3s;
            display: flex;
            align-items: center;
        }

        .sidebar a:hover {
            background: var(--glass);
            color: var(--accent-gold);
        }

        /* Main Content */
        .main-content {
            margin-left: 250px;
            flex: 1;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--glass);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            padding-top: 2rem;
        }

        /* Ticket Card Styling */
        .ticket-card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.4s ease, border-color 0.4s ease;
            backdrop-filter: blur(10px);
        }

        .ticket-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-gold);
        }

        .img-container {
            position: relative;
            height: 180px;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .price-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent-gold);
            color: #000;
            padding: 5px 12px;
            font-weight: bold;
            border-radius: 20px;
        }

        .card-body {
            padding: 1.5rem;
        }

        .card-body h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.2rem;
        }

        .card-body p {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 1.5rem;
        }

        .btn-cart {
            width: 100%;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 0.8rem;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn-cart:hover {
            background: var(--accent-gold);
            color: #000;
        }

        #cart-counter {
            background: var(--accent-gold);
            color: black;
            padding: 2px 8px;
            border-radius: 50%;
            font-size: 0.8rem;
            margin-left: 5px;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>SKY LUX</h2>
    <a href="index.html">Dashboard</a>
    <a href="booking.html">Bookings</a>
    <a href="cart.html">Cart <span id="cart-counter">0</span></a>
</div>

<div class="main-content">
    <header>
        <h1>Global Destinations</h1>
        <p>Premium First Class Routes</p>
    </header>

    <div class="grid" id="ticket-grid">
        </div>
</div>

<script>
    const destinations = [
        { country: "USA", state: "New York", city: "Manhattan" },
        { country: "USA", state: "California", city: "Los Angeles" },
        { country: "France", state: "Île-de-France", city: "Paris" },
        { country: "Japan", state: "Kanto", city: "Tokyo" },
        { country: "UAE", state: "Dubai", city: "Dubai City" },
        { country: "UK", state: "England", city: "London" },
        { country: "Italy", state: "Lazio", city: "Rome" },
        { country: "Australia", state: "NSW", city: "Sydney" },
        { country: "Singapore", state: "Central", city: "Marina Bay" },
        { country: "Germany", state: "Berlin", city: "Berlin" }
    ];

    const grid = document.getElementById('ticket-grid');
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function updateCounter() {
        document.getElementById('cart-counter').innerText = cart.length;
    }

    // Generate 100 Tickets
    for (let i = 1; i <= 100; i++) {
        const data = destinations[i % destinations.length];
        const price = Math.floor(Math.random() * (12000 - 3000) + 3000);
        
        const card = document.createElement('div');
        card.className = 'ticket-card';
        card.innerHTML = `
            <div class="img-container">
                <img src="https://picsum.photos/seed/${i + 50}/400/300" alt="City View">
                <span class="price-tag">$${price.toLocaleString()}</span>
            </div>
            <div class="card-body">
                <h3>${data.city}, ${data.state}</h3>
                <p>${data.country} | Luxury Airways</p>
                <button class="btn-cart" onclick="addToCart('${data.city}', ${price})">Add to Cart</button>
            </div>
        `;
        grid.appendChild(card);
    }

    function addToCart(city, price) {
        cart.push({ city, price, id: Date.now() });
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCounter();
        alert(city + " has been added to your Sky Lux cart.");
    }

    updateCounter();
</script>

</body>
</html>
