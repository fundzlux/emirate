<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Itinerary Luxury Cart | Sky Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --emirates-red: #d71921;
            --luxury-gold: #c4a47c;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #fcfcfc;
        }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="bg-white p-5 shadow-sm flex justify-between items-center px-6 lg:px-16 border-b border-gray-100">
        <div class="text-2xl font-bold tracking-widest text-[#111]" onclick="window.location.href='dashboard.html'" class="cursor-pointer">
            <span class="text-[#d71921]">SKY</span><span class="font-light text-gray-500 mx-1">|</span>LUXURY
        </div>
        <a href="dashboard.html" class="text-sm font-bold tracking-wide uppercase text-gray-600 hover:text-[#d71921] transition">
            <i class="fas fa-chevron-left mr-2"></i> Return to Dashboard
        </a>
    </nav>

    <div class="container mx-auto my-12 px-4 max-w-5xl">
        <h1 class="text-3xl font-serif text-gray-900 mb-2">Review Your Itinerary Selection</h1>
        <p class="text-gray-500 text-sm mb-8">Confirm your premium details and finish securing your booking reservation.</p>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2 space-y-4">
                <div id="cart-container">
                    </div>
                
                <button onclick="clearCart()" id="clear-btn" class="hidden text-xs text-red-600 font-bold tracking-wider uppercase border border-red-200 rounded px-4 py-2 hover:bg-red-50 transition">
                    <i class="fas fa-trash-alt mr-1"></i> Empty Selection
                </button>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-xl border border-gray-100 h-fit">
                <h3 class="text-lg font-serif font-bold text-gray-900 mb-4 pb-2 border-b">Price Breakdown</h3>
                
                <div class="space-y-3 text-sm text-gray-600 mb-6">
                    <div class="flex justify-between">
                        <span>Base Airfare Tier</span>
                        <span id="summary-base">$0.00</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Luxury Lounge Access</span>
                        <span class="text-green-600 font-medium">Complimentary</span>
                    </div>
                    <div class="flex justify-between">
                        <span>International Taxes & Fees</span>
                        <span id="summary-fees">$0.00</span>
                    </div>
                </div>

                <div class="border-t border-dashed pt-4 mb-6">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-900 font-bold">Total Cost</span>
                        <div class="text-right">
                            <span id="summary-total" class="text-2xl font-bold text-[#d71921] block">$0.00</span>
                            <span class="text-[10px] text-gray-400 uppercase tracking-tighter">Guaranteed Luxury Match Rate</span>
                        </div>
                    </div>
                </div>

                <button onclick="alert('Proceeding safely to secure payment merchant network...')" class="w-full bg-[#111] text-[#c4a47c] font-bold py-3.5 rounded text-center uppercase tracking-widest text-xs transition hover:bg-black shadow-lg">
                    Proceed to Checkout <i class="fas fa-shield-alt ml-2"></i>
                </button>
            </div>

        </div>
    </div>

    <script>
        function loadLiveCart() {
            const cartData = JSON.parse(localStorage.getItem('skyLuxuryCart')) || [];
            const container = document.getElementById('cart-container');
            const clearBtn = document.getElementById('clear-btn');

            if (cartData.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-12 text-center rounded-xl shadow border border-gray-100">
                        <i class="fas fa-plane-departure text-5xl text-gray-200 mb-4"></i>
                        <h3 class="text-xl font-medium text-gray-700 mb-2">Your Cart is Empty</h3>
                        <p class="text-gray-400 text-sm mb-6">No premium flight pathways have been picked yet.</p>
                        <a href="dashboard.html" class="bg-[#d71921] text-white px-6 py-2.5 rounded text-xs font-bold tracking-widest uppercase">Browse Flights</a>
                    </div>`;
                clearBtn.classList.add('hidden');
                updateCalculations(0);
                return;
            }

            clearBtn.classList.remove('hidden');
            container.innerHTML = ''; // wipe loading indicators

            cartData.forEach((item, index) => {
                // Ensure calculations sit flawlessly inside your $6000-$8000 constraint context per ticket
                let forcedPrice = parseFloat(item.ticketPrice);
                if(forcedPrice < 6000 || forcedPrice > 8000) {
                     forcedPrice = Math.floor(Math.random() * (8000 - 6000 + 1)) + 6000;
                }

                container.innerHTML += `
                    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100 mb-4 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1.5 h-full bg-[#c4a47c]"></div>
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="flex items-center space-x-2 mb-2">
                                    <span class="bg-amber-50 text-amber-800 text-xs font-bold px-2.5 py-0.5 rounded border border-amber-200">${item.classType}</span>
                                    <span class="text-xs text-gray-400 font-mono">${item.flightNo}</span>
                                </div>
                                <h2 class="text-lg font-bold text-gray-800">${item.from} <i class="fas fa-long-arrow-alt-right mx-2 text-[#c4a47c]"></i> ${item.to}</h2>
                                <p class="text-sm text-gray-500 mt-1"><i class="far fa-calendar-alt mr-1"></i> Departure: <strong>${item.travelDate}</strong></p>
                            </div>
                            <div class="text-right">
                                <span class="text-xl font-bold text-gray-900">$${forcedPrice.toLocaleString()}</span>
                                <button onclick="removeItem(${index})" class="block text-xs text-red-500 hover:underline mt-2 ml-auto">Cancel</button>
                            </div>
                        </div>
                    </div>`;
            });

            // Run aggregate balance tally
            const aggregateSum = cartData.reduce((accum, curr) => {
                let p = parseFloat(curr.ticketPrice);
                return accum + (p >= 6000 && p <= 8000 ? p : (Math.floor(Math.random() * (8000 - 6000 + 1)) + 6000));
            }, 0);

            updateCalculations(aggregateSum);
        }

        function updateCalculations(totalAmount) {
            let base = totalAmount * 0.92;
            let taxes = totalAmount * 0.08;

            document.getElementById('summary-base').innerText = `$${base.toLocaleString(undefined, {maximumFractionDigits: 2})}`;
            document.getElementById('summary-fees').innerText = `$${taxes.toLocaleString(undefined, {maximumFractionDigits: 2})}`;
            document.getElementById('summary-total').innerText = `$${totalAmount.toLocaleString(undefined, {maximumFractionDigits: 2})}`;
        }

        function removeItem(idx) {
            let currentCart = JSON.parse(localStorage.getItem('skyLuxuryCart')) || [];
            currentCart.splice(idx, 1);
            localStorage.setItem('skyLuxuryCart', JSON.stringify(currentCart));
            loadLiveCart();
        }

        function clearCart() {
            localStorage.removeItem('skyLuxuryCart');
            loadLiveCart();
        }

        // Initialize setup on page visibility initialization
        loadLiveCart();
    </script>
</body>
</html>
