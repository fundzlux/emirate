<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart | SkyLuxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; padding: 50px; }
        .cart-container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
        .cart-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee; }
        .total-section { margin-top: 20px; font-size: 20px; font-weight: 700; text-align: right; color: #d71921; }
        .checkout-btn { width: 100%; padding: 15px; background: #d71921; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .clear-btn { background: none; border: none; color: #999; cursor: pointer; font-size: 12px; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="cart-container">
        <h2>Your Flight Bookings</h2>
        <div id="cart-items-list">
            </div>
        <div class="total-section">
            Total: $<span id="total-price">0</span>
        </div>
       <button class="checkout-btn" onclick="window.location.href='payment.html'">Proceed to Payment</button>
        <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
        <p><a href="dashboard.html" style="color: #666; font-size: 14px; text-decoration: none;">← Continue Booking</a></p>
    </div>

    <script>
        function displayCart() {
            let cart = JSON.parse(localStorage.getItem('airlineCart')) || [];
            let list = document.getElementById('cart-items-list');
            let total = 0;
            list.innerHTML = "";

            if(cart.length === 0) {
                list.innerHTML = "<p>Your cart is empty.</p>";
            }

            cart.forEach(item => {
                list.innerHTML += `<div class="cart-item"><span>${item.flight}</span> <strong>$${item.price}</strong></div>`;
                total += item.price;
            });

            document.getElementById('total-price').innerText = total.toLocaleString();
        }

        function clearCart() {
            localStorage.removeItem('airlineCart');
            displayCart();
        }

        displayCart();
    </script>
</body>
</html>
