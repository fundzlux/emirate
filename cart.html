<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Selection | Sky Lux Airways</title>
    <style>
        :root {
            --sky-lux-bg: #0b1121;
            --accent-gold: #c5a059;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Optima', 'Segoe UI', serif;
            background: linear-gradient(135deg, #0b1121 0%, #1a253c 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Navigation (Consistent with Dashboard) */
        .sidebar {
            width: 260px;
            background: rgba(11, 17, 33, 0.95);
            border-right: 1px solid var(--glass-border);
            height: 100vh;
            position: fixed;
            padding: 2rem 1.5rem;
        }

        .logo {
            font-size: 1.8rem;
            color: var(--accent-gold);
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 3rem;
            font-weight: bold;
        }

        .nav-link {
            color: #fff;
            text-decoration: none;
            display: block;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            background: var(--glass);
            color: var(--accent-gold);
            border-left: 3px solid var(--accent-gold);
        }

        /* Main Content Area */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 4rem;
        }

        .cart-header {
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .cart-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* Item Row Styling */
        .cart-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 1.5rem 2rem;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .item-info h3 { color: var(--accent-gold); margin-bottom: 5px; font-weight: normal; }
        .item-info p { opacity: 0.6; font-size: 0.85rem; letter-spacing: 1px; }

        .item-price { font-size: 1.4rem; font-weight: bold; color: var(--text-main); }

        .btn-remove {
            background: transparent;
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
            padding: 6px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.75rem;
            margin-left: 25px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-remove:hover { background: #ff4d4d; color: white; }

        /* Summary Section */
        .checkout-box {
            margin-top: 3rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 3rem;
            border-radius: 20px;
            text-align: right;
            border: 1px solid var(--accent-gold);
        }

        .total-label { font-size: 1.1rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 2px; }
        .total-amount { font-size: 3.5rem; color: var(--accent-gold); font-weight: bold; margin: 10px 0; }

        .btn-payment {
            background: var(--accent-gold);
            color: #0b1121;
            border: none;
            padding: 1.2rem 4rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 1rem;
        }

        .btn-payment:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.5);
        }

        .empty-msg { text-align: center; padding: 6rem; opacity: 0.4; font-style: italic; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">SKY LUX</div>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="bookings.html" class="nav-link">Bookings</a>
        <a href="cart.html" class="nav-link active">My Cart</a>
    </aside>

    <main class="main-content">
        <div class="cart-header">
            <h1>Selected Itineraries</h1>
            <p id="item-count-text">0 Flights in Cart</p>
        </div>

        <div id="cart-items" class="cart-list">
            <!-- JavaScript populates this -->
        </div>

        <div id="checkout-section" class="checkout-box" style="display: none;">
            <p class="total-label">Subtotal</p>
            <div class="total-amount" id="grand-total">$0</div>
            <button class="btn-payment" onclick="proceedToPayment()">Proceed to Payment</button>
        </div>
    </main>

    <script>
        function loadCart() {
            const container = document.getElementById('cart-items');
            const checkoutBox = document.getElementById('checkout-section');
            const grandTotalText = document.getElementById('grand-total');
            const countText = document.getElementById('item-count-text');

            // Fetch from LocalStorage (Matches key used in dashboard)
            let cart = JSON.parse(localStorage.getItem('skyLuxCart')) || [];

            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-msg"><h2>Your private jet is waiting for its first passenger.</h2><p>Browse the dashboard to select your destinations.</p></div>';
                checkoutBox.style.display = 'none';
                countText.innerText = "0 Flights in Cart";
                return;
            }

            checkoutBox.style.display = 'block';
            container.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div class="item-info">
                        <h3>${item.destination}</h3>
                        <p>FIRST CLASS • NON-STOP • SKY LUX EXCLUSIVE</p>
                    </div>
                    <div style="display: flex; align-items: center;">
                        <span class="item-price">$${item.price.toLocaleString()}</span>
                        <button class="btn-remove" onclick="removeFlight(${index})">Remove</button>
                    </div>
                `;
                container.appendChild(itemDiv);
            });

            countText.innerText = `${cart.length} Luxury Flights Selected`;
            grandTotalText.innerText = '$' + total.toLocaleString();
            
            // Store total for the payment page to use
            localStorage.setItem('skyLuxTotal', total);
        }

        function removeFlight(index) {
            let cart = JSON.parse(localStorage.getItem('skyLuxCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('skyLuxCart', JSON.stringify(cart));
            loadCart(); 
        }

        function proceedToPayment() {
            window.location.href = 'payment.html';
        }

        window.onload = loadCart;
    </script>
</body>
</html>
